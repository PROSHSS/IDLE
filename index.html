 const s=fresh(), number=(v,min=0,max=MAX)=>{if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max)throw Error('Número inválido no salvamento.');return v;},integer=(v,min=0,max=MAX)=>{number(v,min,max);if(!Number.isInteger(v))throw Error('Número inteiro inválido.');return v;},array=(v,allowed)=>{if(!Array.isArray(v)||v.length>allowed.length||new Set(v).size!==v.length||v.some(x=>!allowed.includes(x)))throw Error('Lista inválida no salvamento.');return [...v];};
 for(const k of ['money','rep','energy','elapsed','totalTime','lastSeen','arrival','service','puzzleCooldown','orderCooldown','bonusTime'])s[k]=number(raw[k],0,k==='energy'?30:k==='lastSeen'?1e15:MAX);
 for(const k of ['day','chapter','eventCursor','reserveUses','mutiraoDay','adEnergyDay','adRepDay','tutorial','seals','prestiges'])s[k]=integer(raw[k],k==='day'||k==='chapter'?1:0,k==='chapter'?5:k==='tutorial'?6:1e9);
 s.dayLength=number(raw.dayLength,120,160);if(![120,160].includes(s.dayLength)||s.elapsed>s.dayLength)throw Error('Dia inválido no salvamento.');
 for(const p of PRODUCTS)s.stock[p.id]=integer(raw.stock?.[p.id],0,500);
 for(const p of STAFF){const v=raw.staff?.[p.id];if(!v||typeof v.hired!=='boolean'||typeof v.warned!=='boolean')throw Error('Equipe inválida.');s.staff[p.id]={hired:v.hired,warned:v.warned,level:integer(v.level,0,3),mood:number(v.mood,0,100),unhappy:integer(v.unhappy,0,1000)};}
 if(!Array.isArray(raw.schedule)||raw.schedule.length!==4)throw Error('Escala inválida.');s.schedule=raw.schedule.map(a=>array(a,STAFF.map(p=>p.id)));if(s.schedule.some(a=>a.length>2||a.some(id=>!s.staff[id].hired)))throw Error('Escala inválida.');
 if(!raw.upgrades||typeof raw.upgrades!=='object')throw Error('Melhorias inválidas.');s.upgrades={};for(const [id,v] of Object.entries(raw.upgrades)){const u=UPGRADES.find(u=>u.id===id&&u.kind!=='synergy');if(!u)throw Error('Melhoria desconhecida.');s.upgrades[id]=integer(v,1,u.max);}
 for(const [k,allowed] of [['recipes',RECIPES.map(v=>v.id)],['letters',LETTERS.map(v=>v.id)],['unread',LETTERS.map(v=>v.id)],['permanent',PERMANENTS.map(v=>v.id)],['achievements',ACHIEVEMENTS.map(v=>v.id)]])s[k]=array(raw[k],allowed);
 if(s.unread.some(id=>!s.letters.includes(id)))throw Error('Carta inválida.');
 s.effects={};for(const k of ['arrival','price','costRate','patience','service'])if(raw.effects?.[k]!==undefined)s.effects[k]=number(raw.effects[k],0,20);
 for(const k of Object.keys(s.stats))s.stats[k]=number(raw.stats?.[k]);for(const k of ['community','business','clues'])s.flags[k]=number(raw.flags?.[k]);for(const k of ['organized','storm'])s.flags[k]=!!raw.flags?.[k];
 for(const k of ['sound','vibration','large'])s.options[k]=!!raw.options?.[k];
 for(const k of ['paidUpgrade','dayAd'])s[k]=!!raw[k];for(const k of ['shiftSaved','shiftForgiven','shiftRadio']){if(!Array.isArray(raw[k])||raw[k].length!==4||raw[k].some(v=>typeof v!=='boolean'))throw Error('Turno inválido.');s[k]=[...raw[k]];}
 s.ending=raw.ending===null?null:['community','business'].includes(raw.ending)?raw.ending:(()=>{throw Error('Final inválido.');})();s.modifier=raw.modifier===null?null:MODIFIERS.some(v=>v.id===raw.modifier)?raw.modifier:(()=>{throw Error('Modificador inválido.');})();
 if(!Array.isArray(raw.queue)||raw.queue.length>8)throw Error('Fila inválida.');s.queue=raw.queue.map(q=>{if(!CUSTOMERS.some(v=>v.id===q.type)||!PRODUCTS.some(v=>v.id===q.product))throw Error('Cliente inválido.');return{type:q.type,product:q.product,wait:number(q.wait,0,500)};});
 if(!Array.isArray(raw.eventTimes)||raw.eventTimes.length<1||raw.eventTimes.length>3)throw Error('Eventos inválidos.');s.eventTimes=raw.eventTimes.map(v=>number(v,10,150));if(s.eventCursor>s.eventTimes.length)throw Error('Eventos inválidos.');
 s.seenEvents={};for(const e of EVENTS)if(raw.seenEvents?.[e.id]!==undefined)s.seenEvents[e.id]=integer(raw.seenEvents[e.id],1,s.day);
 if(!Array.isArray(raw.debt)||raw.debt.length>10000)throw Error('Fiado inválido.');s.debt=raw.debt.map(v=>({amount:number(v.amount),due:integer(v.due,1,1e9),guaranteed:!!v.guaranteed}));

 for(const k of ['profit','gross','customers','rep'])s.dayStats[k]=number(raw.dayStats?.[k],k==='profit'||k==='rep'?-MAX:0);s.dayStats.event=String(raw.dayStats?.event||'Dia tranquilo.').slice(0,180);

function storageWarning(){storageOK=false;$('storage-warning').innerHTML='<div class="note">⚠️ O navegador bloqueou o salvamento. O jogo continua; exporte seu progresso em Mais.</div>';}
function save(){if(corrupt)return false;state.lastSeen=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch{storageWarning();return false;}}
function load(){let raw;try{raw=localStorage.getItem(KEY);}catch{storageWarning();return fresh();}if(raw){try{return validate(JSON.parse(raw));}catch{corrupt=true;}}return fresh();}
function toast(text){const el=document.createElement('div');el.className='toast';el.textContent=text;$('toasts').append(el);setTimeout(()=>el.remove(),4800);}
function log(text){state.logs.unshift('Dia '+state.day+' · '+text);state.logs=state.logs.slice(0,40);}
function sound(note=520){if(!state.options.sound)return;try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=note;g.gain.setValueAtTime(.06,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.12);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.13);}catch{}}
function feedback(){sound();if(state.options.vibration&&navigator.vibrate)try{navigator.vibrate(18);}catch{}}
function floating(text){if(document.hidden||modal)return;const el=document.createElement('span');el.className='float';el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),1200);}
function gain(amount,silent=false){amount=safe(amount);state.money=safe(state.money+amount);state.stats.earned=safe(state.stats.earned+amount);state.dayStats.profit=safe(state.dayStats.profit+amount,-MAX);state.dayStats.gross=safe(state.dayStats.gross+amount);if(!silent&&amount>=3)floating('+'+reais(amount));}
function spend(amount){amount=safe(amount);if(state.money+1e-7<amount)return false;state.money=safe(state.money-amount);state.stats.spent=safe(state.stats.spent+amount);state.dayStats.profit=safe(state.dayStats.profit-amount,-MAX);return true;}
function reputation(n){if(n<0&&ability('neuza',1)&&!state.shiftForgiven[shift()]){state.shiftForgiven[shift()]=true;return;}const before=state.rep;state.rep=safe(state.rep+n,0,10000);state.dayStats.rep+=state.rep-before;}
function shift(){return Math.min(3,Math.floor(state.elapsed/40));}
function shiftName(){return ['☀️ Manhã','🌤️ Tarde','🌙 Noite','🌌 Serão'][shift()];}
function hiredCount(){return Object.values(state.staff).filter(v=>v.hired).length;}
function working(id){return state.staff[id].hired&&state.schedule[shift()].includes(id);}
function active(id){return working(id)&&state.staff[id].mood>=25;}
function ability(id,n){return active(id)&&state.staff[id].level>=n;}
function skillPower(id){return working(id)?state.staff[id].mood<25?.4:state.staff[id].mood<50?.7:1:0;}
function synergy(id){const s=SYNERGIES.find(s=>s.id===id);return !!s&&active(s.staff)&&has(s.upgrade);}
function unlocked(p){return state.rep>=p.rep||state.chapter>=p.chapter;}
function capacity(){return 35+level('shelf')*20+(has('diesel')?10:0);}
function cap(p){return capacity()+(p.id==='craft'&&has('artisan')?20:0);}
function costRate(p){let rate=1-level('stock')*.04-skillPower('joana')*.12;if(ability('bene',1)&&p.id==='bread')rate*=.75;if(synergy('ledger'))rate*=.8;if(p.id==='greens'&&has('farm')&&!state.flags.storm)rate*=.5;return Math.max(.2,rate*(state.effects.costRate||1));}
function refillInfo(p){const amount=Math.min(has('auto')?10:20,cap(p)-state.stock[p.id]);const bonus=synergy('baker')&&p.id==='bread'?2:1;return{amount:Math.min(cap(p)-state.stock[p.id],amount*bonus),cost:Math.ceil(amount*p.cost*costRate(p))};}
function restock(id,automatic=false){const p=PRODUCTS.find(p=>p.id===id);if(!p||!unlocked(p))return;const r=refillInfo(p);if(!r.amount||!spend(r.cost)){if(!automatic)toast(!r.amount?'Esse estoque já está cheio.':'Falta dinheiro para esta reposição.');return;}state.stock[id]+=r.amount;state.stats.restocks++;if(!automatic){feedback();if(state.tutorial===2){state.tutorial=3;toast('Boa! Agora compre a primeira melhoria.');}render();}}
function priceFor(p,c){let price=p.price*c.pay*(1+level('box')*.05)*(state.effects.price||1);if(shift()===2&&!has('neon'))price*=.75;if(p.id==='bread')price*=1+skillPower('bene')*.35;if(state.modifier==='tourism')price*=1.2;if(state.modifier==='crisis')price*=.85;if(c.id==='child'&&has('daycare'))price/=.85;return safe(price);}
function arrivalInterval(){let rate=1+level('sign')*.08+Math.min(state.rep,250)*.002+skillPower('pedro')*.2+skillPower('neuza')*.25+(has('franchise')?.35:0);rate*=state.effects.arrival||1;if(state.modifier==='rival')rate*=.8;return Math.max(1.8,7/rate);}
function serviceInterval(){let interval=4.8*(1-level('counter')*.08)*(1-skillPower('rita')*.25);if(synergy('fast'))interval*=.7;if(active('rita')&&active('neuza'))interval*=1.25;if(active('bene')&&active('joana'))interval*=.9;return Math.max(.6,interval*(state.effects.service||1));}
function patience(q){const c=CUSTOMERS.find(c=>c.id===q.type);return c.patience+level('fan')*3+(has('music')?12:0)+(c.id==='child'&&has('daycare')?20:0)+(state.effects.patience||0);}
function spawn(){const types=CUSTOMERS.filter(c=>state.rep>=c.rep||(c.id==='tourist'&&state.modifier==='tourism'));if(has('music'))types.push(CUSTOMERS[2]);const c=pick(types),choices=c.likes.filter(id=>unlocked(PRODUCTS.find(p=>p.id===id)));if(has('fair')&&['tourist','dirce'].includes(c.id)&&unlocked(PRODUCTS[5]))choices.push('craft');state.queue.push({type:c.id,product:pick(choices.length?choices:['bread']),wait:0});}
function sale(silent=false){if(!state.queue.length)return;const q=state.queue.shift(),c=CUSTOMERS.find(c=>c.id===q.type),p=PRODUCTS.find(p=>p.id===q.product);if(state.stock[p.id]===0&&!(p.id==='bread'&&ability('bene',3))){reputation(c.id==='gossip'?-1.5:-.5);state.stats.failed++;return;}if(state.stock[p.id]>0)state.stock[p.id]--;let amount=priceFor(p,c),fifth=(state.stats.sales+1)%5===0;if(has('loyalty')&&fifth)amount*=2;
 if(state.recipes.length&&(Math.random()<.24||(synergy('homemade')&&(state.stats.sales+1)%3===0))){const r=RECIPES[pick(state.recipes)];let special=r.price*(has('artisan')?2:1);if(state.modifier==='june'&&[1,2,3,9].includes(r.id))special*=2;amount+=special;}
 if(has('cafe')&&p.id==='coffee'&&state.stock.candy>0){state.stock.candy--;amount+=PRODUCTS[2].price;}
 if(!has('pix')&&!ability('rita',1)&&Math.random()<.025){amount*=.7;reputation(-.5);}
 if(state.bonusTime>0)amount*=2;
 if(has('fiado')&&c.id==='dirce'&&Math.random()<.2){state.debt.push({amount:amount*2,due:state.day+1,guaranteed:ability('joana',1)||perm('credit')});}else gain(amount,silent);
 state.stats.sales++;state.dayStats.customers++;reputation(.08+(c.id==='gossip'?.18:0)+(c.id==='child'&&has('pix')?1:0)+(synergy('neighbors')?.1:0)+(state.modifier==='rival'?.15:0));if(p.id==='bread'&&shift()===0&&has('oven')&&active('bene'))reputation(1);if(synergy('digital')&&fifth)reputation(2);if(has('radio')&&!state.shiftRadio[shift()]){reputation(2);state.shiftRadio[shift()]=true;}
 if(c.id==='inspector'){reputation(state.flags.organized?2:-1);state.dayStats.event='O fiscal '+(state.flags.organized?'elogiou a organização.':'pediu mais cuidado.');}if(c.id==='influencer'){reputation(state.flags.organized?4:-2);state.dayStats.event='O influenciador publicou sua visita.';}
 if(!silent&&Math.random()<.1)sound(650);
}
function changeMood(amount){for(const p of STAFF)if(state.staff[p.id].hired)state.staff[p.id].mood=safe(state.staff[p.id].mood+amount,0,100);}
function newDay(){
 state.day++;state.elapsed=0;state.dayLength=has('extended')&&state.energy>=2?160:120;if(state.dayLength===160)state.energy-=2;
 state.dayStats={profit:0,gross:0,customers:0,rep:0,event:'Um dia tranquilo na vendinha.'};state.dayAd=false;state.reserveUses=0;state.paidUpgrade=false;state.shiftSaved.fill(false);state.shiftForgiven.fill(false);state.shiftRadio.fill(false);state.flags.organized=false;state.flags.storm=false;
 state.queue=[];state.service=0;state.arrival=2;state.eventCursor=0;const count=1+Math.floor(Math.random()*3);state.eventTimes=Array.from({length:count},(_,i)=>20+(state.dayLength-35)*(i+.5)/count);
 for(const p of STAFF){const v=state.staff[p.id];if(!v.hired)continue;const turns=state.schedule.filter(a=>a.includes(p.id)).length;let delta=turns===0?(perm('team')?28:14):turns===1?3:-(turns-1)*(p.id==='tiao'?9:6);if(p.id==='bene'&&state.schedule[0].includes('bene'))delta-=2;if(state.schedule.some(a=>a.includes('rita')&&a.includes('neuza'))&&['rita','neuza'].includes(p.id))delta-=5;v.mood=safe(v.mood+delta,0,100);if(v.mood<20){v.unhappy++;if(!v.warned){v.warned=true;log(p.name+' avisou: precisa de folga ou aumento.');}else if(v.unhappy>=4&&!has('training')){v.hired=false;state.schedule=state.schedule.map(a=>a.filter(id=>id!==p.id));log(p.name+' pediu demissão. Pode ser recontratado.');}}else{v.unhappy=0;v.warned=false;}}
 if(has('solar'))gain(30,true);if(has('franchise'))state.flags.business++;if(state.modifier==='crisis')reputation(2);reputation(level('decor'));
 if(has('pantry'))for(const id of ['candy','coffee'])state.stock[id]=Math.min(capacity(),state.stock[id]+10);
 if(state.schedule[0].includes('bene')&&state.staff.bene.hired&&state.staff.bene.level>=2)state.stock.bread=capacity();
 const debts=state.debt.filter(v=>v.due<=state.day);state.debt=state.debt.filter(v=>v.due>state.day);for(const d of debts)if(d.guaranteed||perm('credit')||Math.random()>=.15)gain(d.amount,true);
 if(state.order&&state.day>state.order.due&&!ability('tiao',3)){if(state.order.accepted){reputation(-1);log('A encomenda venceu; o cliente ficou desapontado.');}state.order=null;}
 if(state.modifier==='ghost'&&state.day%8===0)state.flags.clues++;
}
function chooseDecision(id,offline=false){const d=DECISIONS.find(d=>d.id===id);if(!d||(!offline&&(!state.pending||state.pending.kind!=='closing'||!state.pending.decisions.includes(id))))return;const e=d.effect;if(e.cost)spend(Math.min(120,Math.floor(state.money*e.cost)));changeMood(e.mood||0);state.flags.community+=e.community||0;state.flags.business+=e.business||0;reputation(e.rep||0);state.energy=safe((perm('energy')?14:10)+(e.energy||0),0,25);state.effects={};for(const k of ['arrival','price','costRate','patience','service'])if(e[k]!==undefined)state.effects[k]=e[k];state.pending=null;newDay();if(!offline){closeModal();log('Decisão: '+d.name);render();save();}}
function endDay(offline=false){if(offline){state.energy=perm('energy')?14:10;state.effects={};newDay();return;}state.elapsed=state.dayLength;state.pending={kind:'closing',decisions:shuffled(DECISIONS.map(v=>v.id)).slice(0,perm('choice')?4:3)};save();showPending();}
function nextEvent(){if(state.totalTime<300)return;let available=EVENTS.filter(e=>(!e.chapter||e.chapter===state.chapter)&&(!state.seenEvents[e.id]||state.day-state.seenEvents[e.id]>=10));available=available.filter(e=>e.id!=='briga'||active('rita')&&active('neuza'));if(!available.length)return;const e=pick(available);state.seenEvents[e.id]=state.day;state.pending={kind:'event',id:e.id};save();showPending();}
function eventChoices(e){const choices=e.choices.map(c=>({...c}));if(e.category==='cidade'&&ability('neuza',2))choices.push({name:'Rede da Dona Neuza',desc:'Grátis; +5 reputação e +2 comunidade.',cost:0,rep:5,community:2,business:0,loss:0,mood:0,cash:0});return choices;}
function chooseEvent(index){const e=EVENTS.find(e=>e.id===state.pending?.id);const c=e&&eventChoices(e)[index];if(!c||state.energy<1||!spend(c.cost))return;state.energy--;const protection=e.id==='luz'&&(has('solar')||has('diesel'));reputation(c.rep);state.flags.community+=c.community;state.flags.business+=c.business;changeMood(c.mood);gain(c.cash,true);
 let loss=protection||perm('stock')?0:Math.ceil(c.loss*(1-level('freezer')*.2)*(has('insurance')?.5:1));loss=Math.max(0,loss);for(const p of PRODUCTS)state.stock[p.id]=Math.max(0,state.stock[p.id]-loss);
 if(e.id==='fiscal'&&index===0)reputation(state.flags.organized?4:-2);if(e.id==='fiscal'&&index===1)state.flags.organized=true;if(e.id==='rain')state.flags.storm=true;
 if(e.category==='mistério')state.flags.clues++;state.stats.events++;state.dayStats.event=e.title+' — '+c.name;log(state.dayStats.event);state.pending=null;closeModal();feedback();render();save();}
function skipEvent(){if(state.pending?.kind!=='event')return;state.dayStats.event='Evento deixado com os vizinhos.';state.pending=null;closeModal();render();save();}
function makeOrder(){if(state.order||state.orderCooldown>0||!(has('orders')||active('tiao')||ability('pedro',1)))return;const p=pick(PRODUCTS.filter(unlocked)),amount=has('delivery')?5:10;state.order={product:p.id,amount,reward:p.price*10*3,accepted:false,due:state.day+1};state.orderCooldown=150;}
function deliverOrder(){const o=state.order;if(!o||!o.accepted||state.stock[o.product]<o.amount)return false;state.stock[o.product]-=o.amount;gain(o.reward*(synergy('express')?2:1));reputation(3);state.stats.orders++;log('Encomenda entregue.');state.order=null;return true;}
function tick(dt,offline=false){
 if(state.pending||(!offline&&modal)||state.tutorial===0)return;
 state.totalTime=safe(state.totalTime+dt);state.elapsed=Math.min(state.dayLength,state.elapsed+dt);state.puzzleCooldown=Math.max(0,state.puzzleCooldown-dt);state.orderCooldown=Math.max(0,state.orderCooldown-dt);state.bonusTime=Math.max(0,state.bonusTime-dt);
 gain(dt*.32,true); // Pequena renda de serviços da rua: nunca falta uma saída.
 if(has('auto'))for(const p of PRODUCTS)if(unlocked(p)&&state.stock[p.id]<5)restock(p.id,true);
 state.arrival-=dt;if(state.arrival<=0){state.arrival+=arrivalInterval();if(state.queue.length<8)spawn();}
 state.service+=dt;if(state.service>=serviceInterval()){state.service=0;sale(offline);if(ability('rita',2))sale(offline);}
 for(let i=state.queue.length-1;i>=0;i--){const q=state.queue[i];q.wait+=dt;if(q.wait>patience(q)&&!synergy('serenade')){if(ability('rita',3)&&!state.shiftSaved[shift()]){state.shiftSaved[shift()]=true;q.wait=0;}else{state.queue.splice(i,1);reputation(-.3);state.stats.failed++;}}}
 if(state.order?.accepted&&ability('tiao',1))deliverOrder();makeOrder();
 if(state.elapsed>=state.dayLength){endDay(offline);return;}
 if(state.eventCursor<state.eventTimes.length&&state.elapsed>=state.eventTimes[state.eventCursor]){state.eventCursor++;if(!offline)nextEvent();}
}
function applyOffline(seconds){
 if(seconds<15||state.pending||state.tutorial===0)return null;const capped=Math.min(8*3600,Math.max(0,seconds)),effective=capped*(perm('offline')?.65:.5),before=state.money,sales=state.stats.sales,day=state.day;let left=effective;
 // Ausência não gera janelas: as decisões continuam nas mãos do jogador.
 while(left>0){const dt=Math.min(1,left);tick(dt,true);left-=dt;}
 state.stats.offlineSeconds+=capped;state.lastSeen=Date.now();return{seconds:capped,effective,money:state.money-before,sales:state.stats.sales-sales,days:state.day-day};
}
function checkMilestones(){
 if(state.pending||modal)return;

function startPuzzle(free=false){if(!free&&(state.energy<1||state.puzzleCooldown>0))return;if(!free){state.energy--;state.puzzleCooldown=90;}puzzle=Array.from({length:16},(_,i)=>Math.floor(i/4));if(perm('puzzle'))[puzzle[0],puzzle[5]]=[puzzle[5],puzzle[0]];else{for(let i=0;i<24;i++){const a=Math.floor(Math.random()*16),b=Math.floor(Math.random()*16);[puzzle[a],puzzle[b]]=[puzzle[b],puzzle[a]];}if(puzzleSolved())[puzzle[0],puzzle[5]]=[puzzle[5],puzzle[0]];}selectedCell=-1;puzzleTime=45;renderPuzzle();save();}

function confirmImport(){try{const text=$('save-text').value.trim();if(!text||text.length>250000)throw Error('Tamanho inválido.');const binary=atob(text),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0)),candidate=validate(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)));state=candidate;corrupt=false;state.lastSeen=Date.now();ingredients=[];closeModal();render();save();if(state.pending)showPending();toast('Partida importada com sucesso.');}catch{$('import-error').textContent='Código inválido, corrompido ou de outra versão. Sua partida atual foi preservada.';}}

});
document.addEventListener('change',e=>{const el=e.target;if(!el.matches('select[data-shift]'))return;const i=Number(el.dataset.shift),slot=Number(el.dataset.slot),id=el.value;if(state.energy<1){toast('Escalar custa 1 energia. Tente no próximo dia.');render();return;}if(id&&(!state.staff[id]?.hired||state.schedule[i].some((v,j)=>v===id&&j!==slot))){toast('Cada pessoa só pode ocupar uma vaga no mesmo turno.');render();return;}const before=state.schedule[i][slot]||'';if(before===id)return;const slots=[state.schedule[i][0]||'',state.schedule[i][1]||''];slots[slot]=id;state.schedule[i]=slots.filter(Boolean);state.energy--;render();save();});
document.addEventListener('keydown',e=>{if(!modal)return;const root=$('modal-root');if(e.key==='Escape'&&corrupt){showCorrupt();return;}if(e.key==='Escape'&&!state.pending&&!['ad','puzzle','corrupt'].includes(modal)){closeModal();render();}if(e.key==='Tab'){const focus=[...root.querySelectorAll('button:not(:disabled),textarea,select,input,[tabindex="0"]')];if(!focus.length){e.preventDefault();return;}const first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('modal'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(puzzle){puzzle=null;closeModal();}hiddenAt=Date.now();save();}else{const seconds=hiddenAt?(Date.now()-hiddenAt)/1000:0;hiddenAt=0;lastFrame=performance.now();if(modal==='ad')return;const summary=applyOffline(seconds);render();if(summary)showOffline(summary);}});
window.addEventListener('pagehide',()=>save());
function frame(now){const realDt=Math.min(.25,Math.max(0,(now-lastFrame)/1000||0));lastFrame=now;if(!document.hidden){if(modal==='puzzle'&&puzzle){puzzleTime=Math.max(0,puzzleTime-realDt);if($('puzzle-clock'))$('puzzle-clock').textContent='⏳ '+Math.ceil(puzzleTime)+'s';if(puzzleTime<=0)finishPuzzle(false);}else{let remaining=realDt*debugSpeed;while(remaining>0){const dt=Math.min(.25,remaining);tick(dt);remaining-=dt;}}if(now-lastPaint>500){lastPaint=now;if(paintedShift!==shift())render();paintHUD();paintShop();refreshButtons();checkMilestones();}if(now-lastSave>10000){lastSave=now;if(!corrupt)save();}}requestAnimationFrame(frame);}
state=load();const absence=Math.max(0,(Date.now()-state.lastSeen)/1000);render();paintShop();
function showCorrupt(){openModal('corrupt','<div class="hero">📓</div><h2>O caderno não abriu.</h2><p>O salvamento está corrompido ou usa outra versão. Ele não será sobrescrito até você escolher começar de novo.</p><div class="actions">'+button('Começar uma nova história','corrupt-new')+button('Importar uma cópia','import','','','light')+'</div>');}
if(corrupt)showCorrupt();
else{const summary=applyOffline(absence);render();if(summary)showOffline(summary);else if(state.pending)showPending();}
lastFrame=performance.now();lastSave=lastFrame;requestAnimationFrame(frame);
</script>
</body>
</html>
